services:
  juice-shop:
    image: bkimminich/juice-shop:v17.1.1
    ports:
      - "3000:3000"
    networks:
      - lab

  zap:
    image: zaproxy/zap-stable:2.15.0
    user: root
    volumes:
      - ./reports:/zap/wrk/reports:rw
    networks:
      - lab
    command:
      - "zap-baseline.py"
      - "-t"
      - "http://juice-shop:3000"
      - "-r"
      - "reports/zap-report.html"
      - "-J"
      - "reports/zap-report.json"
      - "-w"
      - "reports/zap-report.md"
      - "-I"
    restart: "no"

networks:
  lab:
